<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Approximate Square Root Challenge</title>

<style>

body{
font-family:Arial, sans-serif;
background:#eef2f7;
text-align:center;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

button{
padding:12px 20px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.green{
background:#4CAF50;
color:white;
}

.blue{
background:#2196F3;
color:white;
}

.orange{
background:#FF9800;
color:white;
}

.purple{
background:#9C27B0;
color:white;
}

.hidden{
display:none;
}

#question{
font-size:36px;
margin:20px;
font-weight:bold;
}

#feedback{
margin-top:20px;
text-align:left;
padding:15px;
background:#f8f8f8;
border-radius:10px;
}

.numberline{
font-family:monospace;
white-space:pre;
font-size:18px;
}

</style>

</head>
<body>

<div class="container">

<h1>🎯 Approximate Square Root Challenge</h1>

<div id="menu">

<h2>Main Menu</h2>

<button class="green" onclick="startPractice()">
⭐ Practice Mode
</button>

<button class="green" onclick="startGame()">
🟢 Level 1 (1-400)
</button>

<p>
Estimate square roots to the nearest tenth.<br>
Answers within ±0.1 are accepted.
</p>

</div>

<div id="game" class="hidden">

<h2 id="mode"></h2>

<p>
Score:
<span id="score">0</span>
</p>

<p>
Question
<span id="current">1</span>
of
<span id="total">10</span>
</p>

<div id="question"></div>

<input id="answer"
type="number"
step="0.1">

<br><br>

<button class="blue" onclick="checkAnswer()">
Submit
</button>

<button class="orange" onclick="showHint()">
Hint
</button>

<button class="orange" onclick="showSolution()">
Solution
</button>

<button class="purple" onclick="nextQuestion()">
Next Question
</button>

<div id="feedback"></div>

</div>

</div>

<script>

let practice=false;
let score=0;
let currentQuestion=1;
let totalQuestions=10;

let target;
let root;
let lowerRoot;
let upperRoot;

function startPractice(){

practice=true;

document.getElementById("menu").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");

document.getElementById("mode").innerHTML=
"⭐ Practice Mode";

generateQuestion();

}

function startGame(){

practice=false;

score=0;
currentQuestion=1;

document.getElementById("score").innerHTML=score;

document.getElementById("menu").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");

document.getElementById("mode").innerHTML=
"🟢 Level 1";

generateQuestion();

}

function isPerfectSquare(n){

return Number.isInteger(Math.sqrt(n));

}

function generateQuestion(){

do{

target=Math.floor(Math.random()*399)+2;

}
while(isPerfectSquare(target));

root=Math.sqrt(target);

lowerRoot=Math.floor(root);
upperRoot=lowerRoot+1;

document.getElementById("question").innerHTML=
"√" + target;

document.getElementById("answer").value="";

document.getElementById("feedback").innerHTML="";

document.getElementById("current").innerHTML=currentQuestion;

}

function checkAnswer(){

let student=
parseFloat(document.getElementById("answer").value);

if(isNaN(student)){

alert("Enter an answer.");

return;

}

let targetEstimate=
Math.round(root*10)/10;

let low=
targetEstimate-0.1;

let high=
targetEstimate+0.1;

if(student>=low && student<=high){

document.getElementById("feedback").innerHTML=
`
<h3>✅ Correct!</h3>

<p>
Accepted Range:
<b>${low.toFixed(1)}</b>
to
<b>${high.toFixed(1)}</b>
</p>

<p>
Target Estimate:
<b>${targetEstimate.toFixed(1)}</b>
</p>
`;

if(!practice){

score+=10;

document.getElementById("score").innerHTML=score;

}

}
else{

document.getElementById("feedback").innerHTML=
`
<h3>❌ Not Quite</h3>

<p>
Accepted Range:
<b>${low.toFixed(1)}</b>
to
<b>${high.toFixed(1)}</b>
</p>

<p>
Click Solution for a full walkthrough.
</p>
`;

}

}

function showHint(){

document.getElementById("feedback").innerHTML=
`
<h3>💡 Hint</h3>

<p>Find the benchmark perfect squares:</p>

<p>
${lowerRoot*lowerRoot}
=
(${lowerRoot})²
</p>

<p>
${upperRoot*upperRoot}
=
(${upperRoot})²
</p>

<p>
The answer must be between
${lowerRoot}
and
${upperRoot}.
</p>
`;

}

function showSolution(){

let lowerSquare=
lowerRoot*lowerRoot;

let upperSquare=
upperRoot*upperRoot;

let position=
(target-lowerSquare)/(upperSquare-lowerSquare);

let dots=Math.round(position*30);

let line="";

for(let i=0;i<31;i++){

if(i===dots){

line+="●";

}else{

line+="-";

}

}

document.getElementById("feedback").innerHTML=
`
<h3>✅ Step-by-Step Solution</h3>

<b>Step 1</b>

<p>
Find nearby perfect squares:
</p>

<p>
${lowerSquare}
<
${target}
<
${upperSquare}
</p>

<b>Step 2</b>

<p>
√${lowerSquare}
=
${lowerRoot}
</p>

<p>
√${upperSquare}
=
${upperRoot}
</p>

<b>Step 3</b>

<p>
Place the number on a number line.
</p>

<div class="numberline">

${lowerRoot}
${line}
${upperRoot}

</div>

<b>Step 4</b>

<p>
The answer must be between
${lowerRoot}
and
${upperRoot}.
</p>

<b>Step 5</b>

<p>
Calculator estimate:
</p>

<p>
√${target}
≈
${root.toFixed(3)}
</p>

<b>Step 6</b>

<p>
Nearest tenth:
</p>

<h2>
${(Math.round(root*10)/10).toFixed(1)}
</h2>
`;

}

function nextQuestion(){

if(!practice){

currentQuestion++;

if(currentQuestion>totalQuestions){

document.getElementById("feedback").innerHTML=
`
<h2>🏆 Game Complete!</h2>

<h3>Final Score: ${score}</h3>

<p>
You answered
${totalQuestions}
questions.
</p>
`;

return;

}

}

generateQuestion();

}

</script>

</body>
</html>
