<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Approximate Square Root Challenge V2</title>

<style>

body{
    font-family:Arial, sans-serif;
    background:#eef4ff;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0px 0px 15px rgba(0,0,0,0.2);
}

h1{
    color:#0d47a1;
}

button{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.practice{
    background:#43a047;
    color:white;
}

.level1{
    background:#1e88e5;
    color:white;
}

.level2{
    background:#8e24aa;
    color:white;
}

.level3{
    background:#ef6c00;
    color:white;
}

.control{
    background:#546e7a;
    color:white;
}

#gameArea{
    display:none;
}

#question{
    font-size:36px;
    font-weight:bold;
    margin:20px;
}

#feedback{
    margin-top:20px;
    text-align:left;
    padding:15px;
    border-radius:10px;
    background:#f7f7f7;
}

#progressBar{
    width:100%;
    height:25px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

#progress{
    width:0%;
    height:100%;
    background:#43a047;
}

.numberLine{
    font-family:monospace;
    white-space:pre;
    font-size:18px;
    margin-top:10px;
}

input{
    padding:10px;
    width:150px;
    font-size:18px;
    text-align:center;
}

.stats{
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.card{
    background:#f1f1f1;
    padding:10px;
    border-radius:10px;
    min-width:150px;
    margin:5px;
}

</style>

</head>

<body>

<div class="container">

<h1>🎯 Approximate Square Root Challenge V2</h1>

<div id="menu">

<h2>Main Menu</h2>

<button class="practice" onclick="startMode('practice')">
⭐ Practice Mode
</button>

<button class="level1" onclick="startMode('level1')">
🟢 Level 1
</button>

<button class="level2" onclick="startMode('level2')">
🔵 Level 2
</button>

<button class="level3" onclick="startMode('level3')">
🔴 Level 3
</button>

<br><br>

<p>
Level 1: Whole Numbers (1–400)
</p>

<p>
Level 2: Decimals (0–10)
</p>

<p>
Level 3: Mixed Challenge
</p>

</div>

<div id="gameArea">

<h2 id="modeTitle"></h2>

<div class="stats">

<div class="card">
Question
<br>
<span id="questionCount">1 / 10</span>
</div>

<div class="card">
Score
<br>
<span id="score">0</span>
</div>

<div class="card">
Streak
<br>
<span id="streak">0</span>
</div>

</div>

<div id="progressBar">

<div id="progress"></div>

</div>

<div id="question">

Question Appears Here

</div>

<input id="answer" type="number">

<br><br>

<button class="control" onclick="submitAnswer()">
Submit
</button>

<button class="control" onclick="showHint1()">
Hint 1
</button>

<button class="control" onclick="showHint2()">
Hint 2
</button>

<button class="control" onclick="showHint3()">
Hint 3
</button>

<button class="control" onclick="showSolution()">
Solution
</button>

<button class="control" onclick="nextQuestion()">
Next Question
</button>

<div id="feedback"></div>

</div>

</div>

<script>

let mode="";
let score=0;
let streak=0;
let questionNumber=1;

function startMode(selectedMode){

mode=selectedMode;

document.getElementById("menu").style.display="none";

document.getElementById("gameArea").style.display="block";

if(mode==="practice"){
document.getElementById("modeTitle").innerHTML=
"⭐ Practice Mode";
}

if(mode==="level1"){
document.getElementById("modeTitle").innerHTML=
"🟢 Level 1: Whole Numbers";
}

if(mode==="level2"){
document.getElementById("modeTitle").innerHTML=
"🔵 Level 2: Decimals";
}

if(mode==="level3"){
document.getElementById("modeTitle").innerHTML=
"🔴 Level 3: Mixed Challenge";
}

document.getElementById("feedback").innerHTML=
"<b>Game loaded successfully.</b><br><br>Version 2 framework ready.";

}

function submitAnswer(){

document.getElementById("feedback").innerHTML=
"Answer checking engine will be added next.";

}

function showHint1(){

document.getElementById("feedback").innerHTML=
"💡 Hint 1: Find the nearest perfect squares.";

}

function showHint2(){

document.getElementById("feedback").innerHTML=
"💡 Hint 2: Compare distances from each benchmark.";

}

function showHint3(){

document.getElementById("feedback").innerHTML=
"💡 Hint 3: Use the number line to estimate.";

}

function showSolution(){

document.getElementById("feedback").innerHTML=
`
<h3>Teacher Solution Area</h3>

<p>
The complete step-by-step solution will appear here.
</p>

<div class="numberLine">
49 --------57●-------- 64
</div>

<div class="numberLine">
7 ----------●--------- 8
</div>
`;

}

function nextQuestion(){

document.getElementById("feedback").innerHTML=
"Next question engine coming in Part 2.";

}

</script>

</body>
</html>
